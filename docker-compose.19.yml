# Odoo 19 test bench for the migrate-19 port. Separate compose project, volumes and no
# published ports, so it runs next to the 17 sandbox (project "aero") without touching it.
# Used by scripts/test19.sh; not meant for day-to-day development.
name: aero19

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - pgdata19:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  odoo:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./addons:/mnt/extra-addons
      - odoo-data19:/var/lib/odoo

volumes:
  pgdata19:
  odoo-data19:
